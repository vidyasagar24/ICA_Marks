{% extends "base.html" %}
{% block title %}Change Password{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-6 col-lg-5">
    <div class="card card-custom">
      <div class="card-header-custom">
        <span class="fs-6"><i class="fa-solid fa-key text-primary me-2"></i> Change Account Password</span>
      </div>
      <div class="card-body p-4">
        <form method="POST" action="{{ url_for('auth.change_password') }}">
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">CURRENT PASSWORD</label>
            <input type="password" class="form-control" name="current_password" required autofocus>
          </div>
          <div class="mb-3">
            <label class="form-label small fw-semibold text-secondary">NEW PASSWORD</label>
            <input type="password" class="form-control" name="new_password" minlength="6" required>
            <div class="form-text">Minimum 6 characters with mixed characters recommended.</div>
          </div>
          <div class="mb-4">
            <label class="form-label small fw-semibold text-secondary">CONFIRM NEW PASSWORD</label>
            <input type="password" class="form-control" name="confirm_password" minlength="6" required>
          </div>

          <div class="d-flex justify-content-end gap-2">
            <a href="javascript:history.back()" class="btn btn-light border">Cancel</a>
            <button type="submit" class="btn btn-primary-custom px-4">Update Password</button>
          </div>
        </form>
      </div>
    </div>
  </div>
</div>
{% endblock %}
