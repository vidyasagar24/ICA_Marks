{% extends "base.html" %}
{% block title %}Semesters{% endblock %}

{% block content %}
<div class="d-flex justify-content-between align-items-center mb-4">
  <div>
    <h4 class="fw-bold mb-1 text-dark">Academic Semesters</h4>
    <p class="text-muted small mb-0">Undergraduate & Postgraduate Semester Hierarchy (I to VIII) (FR-04)</p>
  </div>
</div>

<div class="card card-custom">
  <div class="table-responsive">
    <table class="table table-custom">
      <thead>
        <tr>
          <th>Semester #</th>
          <th>Roman Title</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for s in semesters %}
          <tr>
            <td class="fw-bold">{{ s.number }}</td>
            <td class="text-primary fw-semibold">{{ s.name }}</td>
            <td>
              <span class="badge bg-success">Active</span>
            </td>
          </tr>
        {% endfor %}
      </tbody>
    </table>
  </div>
</div>
{% endblock %}
